<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="hljs-dark.css" media="(prefers-color-scheme: dark)">
<script src="highlight.min.js"></script>
<script src="mermaid.min.js"></script>
<script src="headings.js"></script>
<script src="viewer.js"></script>
<script>
  function ldSetBase(href) {
    let b = document.querySelector('base');
    if (!b) { b = document.createElement('base'); document.head.appendChild(b); }
    b.href = href;
  }
  let ldLastHTML = '';
  let ldGeneration = 0;

  function ldRender(html) {
    ldLastHTML = html;
    ldAnchors = null;
    const gen = ++ldGeneration;
    const c = document.getElementById('content');
    c.innerHTML = html;
    ldAddHeadingIds(c);
    c.querySelectorAll('pre code:not(.language-mermaid)').forEach(el => hljs.highlightElement(el));
    c.querySelectorAll('li input[type=checkbox], input[data-line]').forEach(el => { el.disabled = false; });
    ldRenderMermaid(c, gen);
  }
  // Scroll sync. Elements carry data-sourcepos="startLine:col-endLine:col"; lines are 1-based
  // and fractional (12.5 = halfway through line 12), matching the editor.
  let ldAnchors = null;
  let ldLastLine = 1, ldLastAtBottom = false;
  let ldLeader = 'editor';
  let ldIgnoreScrollUntil = 0;

  function ldGetAnchors() {
    if (ldAnchors) return ldAnchors;
    const list = [];
    document.querySelectorAll('#content [data-sourcepos]').forEach(el => {
      const m = /^(\d+):\d+-(\d+):\d+/.exec(el.dataset.sourcepos);
      if (!m) return;
      const r = el.getBoundingClientRect();
      if (r.height === 0) return;
      list.push({ start: +m[1], end: Math.max(+m[1], +m[2]), top: r.top + scrollY, bottom: r.bottom + scrollY });
    });
    return (ldAnchors = list);
  }

  // The innermost element whose `key` value is the largest one not past `value`.
  function ldPick(list, key, value) {
    let best = null;
    for (const a of list) {
      if (a[key] > value) continue;
      if (!best || a[key] > best[key] || (a[key] === best[key] && a.end - a.start < best.end - best.start)) best = a;
    }
    return best;
  }

  function ldYForLine(line) {
    const anchors = ldGetAnchors();
    if (!anchors.length) return 0;
    const first = anchors.reduce((a, b) => (b.start < a.start ? b : a));
    if (line < first.start) return first.top * Math.max(0, line) / first.start;
    const a = ldPick(anchors, 'start', line);
    if (line < a.end + 1) return a.top + (line - a.start) / (a.end - a.start + 1) * (a.bottom - a.top);
    const next = anchors.filter(b => b.start > a.end).reduce((x, b) => (!x || b.start < x.start ? b : x), null);
    if (!next) return a.bottom;
    const t = (line - a.end - 1) / Math.max(1, next.start - a.end - 1);
    return a.bottom + Math.min(1, t) * (next.top - a.bottom);
  }

  function ldLineForY(y) {
    const anchors = ldGetAnchors();
    if (!anchors.length) return 1;
    const first = anchors.reduce((a, b) => (b.top < a.top ? b : a));
    if (y < first.top) return first.start * y / Math.max(1, first.top);
    const a = ldPick(anchors, 'top', y);
    if (y < a.bottom) return a.start + (y - a.top) / Math.max(1, a.bottom - a.top) * (a.end - a.start + 1);
    const next = anchors.filter(b => b.top >= a.bottom).reduce((x, b) => (!x || b.top < x.top ? b : x), null);
    if (!next) return a.end + 1;
    const t = (y - a.bottom) / Math.max(1, next.top - a.bottom);
    return a.end + 1 + Math.min(1, t) * Math.max(0, next.start - a.end - 1);
  }

  function ldScrollToLine(line, atBottom) {
    ldLastLine = line; ldLastAtBottom = atBottom; ldLeader = 'editor';
    ldIgnoreScrollUntil = performance.now() + 150;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, atBottom ? max : Math.min(max, ldYForLine(line)));
  }

  // Report preview scrolling to the editor: right away, then once more 30ms later for the final
  // position. (Not requestAnimationFrame: WebKit pauses it when the window isn't visible.)
  let ldScrollTimer = null;
  function ldReportScroll() {
    ldLeader = 'preview';
    const max = document.documentElement.scrollHeight - window.innerHeight;
    ldPost({ type: 'previewScroll', line: ldLineForY(window.scrollY), atBottom: max > 0 && window.scrollY >= max - 1 });
  }
  window.addEventListener('scroll', () => {
    if (performance.now() < ldIgnoreScrollUntil || ldScrollTimer) return;
    ldReportScroll();
    ldScrollTimer = setTimeout(() => { ldScrollTimer = null; ldReportScroll(); }, 30);
  });

  // Layout changes (images loading, diagrams, resizing) move elements: re-measure, and keep
  // following the editor if it was the one being scrolled.
  new ResizeObserver(() => {
    ldAnchors = null;
    if (ldLeader === 'editor') ldScrollToLine(ldLastLine, ldLastAtBottom);
  }).observe(document.documentElement);

  // Same flowchart spacing as GitHub, which also uses Mermaid 12's default ELK layout.
  const ldMermaidFlowchart = { diagramPadding: 48 };

  // Mermaid: rendered SVGs are cached by theme + source, so editing other
  // parts of the document doesn't re-render (or flicker) existing diagrams.
  const ldDark = matchMedia('(prefers-color-scheme: dark)');
  const ldMermaidCache = new Map();
  let ldMermaidTheme = null;
  let ldMermaidSeq = 0;

  async function ldRenderMermaid(container, gen) {
    const blocks = container.querySelectorAll('pre > code.language-mermaid');
    if (!blocks.length) return;
    const theme = ldDark.matches ? 'dark' : 'default';
    if (theme !== ldMermaidTheme) {
      mermaid.initialize({ startOnLoad: false, theme, securityLevel: 'strict', flowchart: ldMermaidFlowchart });
      ldMermaidTheme = theme;
    }
    for (const code of blocks) {
      const src = code.textContent;
      const key = theme + '\n' + src;
      const div = document.createElement('div');
      div.className = 'mermaid';
      let svg = ldMermaidCache.get(key);
      if (svg === undefined) {
        try {
          await mermaid.parse(src);
          svg = (await mermaid.render('ld-mermaid-' + (++ldMermaidSeq), src)).svg;
          ldMermaidCache.set(key, svg);
        } catch (e) {
          if (gen !== ldGeneration) return;
          const err = document.createElement('div');
          err.className = 'mermaid-error';
          err.textContent = 'Mermaid: ' + (e && e.message ? e.message : e);
          code.parentElement.after(err);
          continue;
        }
      }
      if (gen !== ldGeneration) return; // a newer render replaced the DOM
      div.innerHTML = svg;
      if (code.parentElement.dataset.sourcepos) div.dataset.sourcepos = code.parentElement.dataset.sourcepos;
      code.parentElement.replaceWith(div);
    }
    ldAnchors = null; // diagrams change the page height
  }
  ldDark.addEventListener('change', () => ldRender(ldLastHTML));
  function ldPost(message) {
    if (window.webkit && webkit.messageHandlers.lightdown) webkit.messageHandlers.lightdown.postMessage(message);
  }

  // Clicking a task checkbox edits the source; the re-render then shows the new state.
  document.addEventListener('click', e => {
    const box = e.target.closest('input[type=checkbox]');
    if (!box) return;
    const li = box.closest('li[data-sourcepos]');
    if (box.dataset.line) {   // in a table cell or a paragraph line
      e.preventDefault();
      ldPost({ type: 'toggleBox', line: +box.dataset.line, column: +box.dataset.column });
    } else if (li) {
      e.preventDefault();
      ldPost({ type: 'toggleTask', line: parseInt(li.dataset.sourcepos, 10) });
    }
  });

  // In-page anchors (e.g. footnotes) would otherwise resolve against <base>.
  document.addEventListener('click', e => {
    const a = e.target.closest('a');
    const href = a && a.getAttribute('href');
    if (href && href.startsWith('#')) {
      e.preventDefault();
      const el = document.getElementById(decodeURIComponent(href.slice(1)));
      if (el) el.scrollIntoView();
    }
  });
</script>
</head>
<body><article id="content" class="markdown-body"></article></body>
</html>
